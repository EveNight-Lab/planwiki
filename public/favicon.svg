<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 베이스 배경 캔버스 (각진 직각 라운딩) -->
  <rect width="120" height="120" rx="20" fill="#0A0F1D" />

  <!-- 배경 미세 설계 그리드선 -->
  <path d="M26 40 H94 M26 62 H94 M26 84 H94 M44 24 V96 M70 24 V96" 
        stroke="#152033" stroke-width="1" stroke-dasharray="2 2" />

  <!-- [P 루프 = 좌측 기둥 축 + 1.0 직각 단락 프레임] -->
  <path d="M 32 94 V 26 H 88 V 56 H 32" 
        fill="#101D33" stroke="#38BDF8" stroke-width="4" stroke-linejoin="miter" stroke-linecap="square" />

  <!-- 1.0 단락 추상 모듈 (인덱스 슬롯 + 메인 콘텐츠 바) -->
  <rect x="42" y="34" width="10" height="14" fill="#38BDF8" />
  <rect x="58" y="38" width="20" height="6" fill="#BAE6FD" />

  <!-- 하위 단락 WBS 직각 분기선 -->
  <path d="M 32 72 H 46 M 32 86 H 46" 
        stroke="#0284C7" stroke-width="3" stroke-linecap="square" />

  <!-- [1.1 서브 모듈 블록] -->
  <rect x="46" y="65" width="42" height="14" fill="#132035" stroke="#0284C7" stroke-width="2" />
  <rect x="52" y="69" width="5" height="6" fill="#0284C7" />
  <rect x="62" y="70.5" width="18" height="3" fill="#64748B" />

  <!-- [1.2 서브 모듈 블록 (액티브)] -->
  <rect x="46" y="79" width="42" height="14" fill="#132035" stroke="#38BDF8" stroke-width="2" />
  <rect x="52" y="83" width="5" height="6" fill="#38BDF8" />
  <rect x="62" y="84.5" width="18" height="3" fill="#38BDF8" />

  <!-- 설계 원점 앵커 포인트 -->
  <rect x="29" y="23" width="6" height="6" fill="#FFFFFF" />
</svg>