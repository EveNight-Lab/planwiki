# main 브랜치에 푸시(머지)될 때 Firebase Hosting live 채널에 자동 배포
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate Firebase Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVENIGHT_CLOUD || secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::[Firebase Secret Missing] GitHub Secrets에 FIREBASE_SERVICE_ACCOUNT_EVENIGHT_CLOUD 키가 설정되지 않았습니다."
            echo "💡 해결 방법: https://github.com/EveNight-Lab/planwiki/settings/secrets/actions 에서 'FIREBASE_SERVICE_ACCOUNT_EVENIGHT_CLOUD' 시크릿을 등록해주세요."
            exit 1
          fi

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVENIGHT_CLOUD || secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: evenight-cloud
          target: planwiki
